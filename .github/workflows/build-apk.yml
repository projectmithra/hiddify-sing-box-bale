name: Build Hiddify APK with Bale transport

on:
  workflow_dispatch:
    inputs:
      hiddify_core_version:
        description: 'Hiddify core version tag (e.g., v4.1.0)'
        required: true
        default: 'v4.1.0'
      hiddify_next_ref:
        description: 'Hiddify-Next branch/tag'
        required: true
        default: 'main'

env:
  GO_VERSION: '1.25.6'
  FLUTTER_VERSION: '3.29.3'

jobs:
  build-core:
    name: Build hiddify-core .aar with Bale transport
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hiddify-sing-box-bale (our custom sing-box)
        uses: actions/checkout@v4
        with:
          path: hiddify-sing-box-bale
          submodules: recursive

      - name: Checkout bale-transport (protobuf codec)
        uses: actions/checkout@v4
        with:
          repository: projectmithra/bale-transport
          token: ${{ secrets.PAT_TOKEN }}
          path: bale-transport

      - name: Checkout hiddify-next-core
        uses: actions/checkout@v4
        with:
          repository: hiddify/hiddify-next-core
          ref: ${{ inputs.hiddify_core_version }}
          path: hiddify-next-core
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Install gomobile
        run: |
          GOTOOLCHAIN=local go install golang.org/x/mobile/cmd/gomobile@latest
          GOTOOLCHAIN=local go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init

      - name: Patch hiddify-next-core to use our sing-box fork
        working-directory: hiddify-next-core
        run: |
          # Redirect ALL ./hiddify-sing-box paths to our fork
          sed -i 's|=> ./hiddify-sing-box|=> ../hiddify-sing-box-bale|g' go.mod
          
          # Add bale-transport dependency
          echo "" >> go.mod
          echo "require github.com/projectmithra/bale-transport v0.0.0" >> go.mod
          echo "replace github.com/projectmithra/bale-transport => ../bale-transport" >> go.mod
          
          # Add gomobile tool dependency
          go get -tool github.com/sagernet/gomobile/cmd/gobind
          
          # Tidy
          GONOSUMDB='*' GONOSUMCHECK='*' GOFLAGS='-mod=mod' go mod tidy || true
          
          echo "=== Patched go.mod replace directives ==="
          grep "replace" go.mod


      - name: Build Android .aar
        working-directory: hiddify-next-core
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          GOTOOLCHAIN: local
        run: |
          TAGS="with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,with_grpc"
          
          CGO_LDFLAGS="-O2 -g -s -w -Wl,-z,max-page-size=16384" \
          gomobile bind -v \
            -androidapi=21 \
            -javapkg=com.hiddify.core \
            -libname=hiddify-core \
            -tags="$TAGS" \
            -trimpath \
            -ldflags="-w -s -checklinkname=0 -buildid=" \
            -target=android \
            -gcflags "all=-N -l" \
            -o hiddify-core.aar \
            github.com/sagernet/sing-box/experimental/libbox \
            ./platform/mobile
          
          ls -la hiddify-core.aar

      - name: Upload .aar artifact
        uses: actions/upload-artifact@v4
        with:
          name: hiddify-core-bale-aar
          path: hiddify-next-core/hiddify-core.aar

  build-apk:
    name: Build Hiddify APK
    needs: build-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hiddify-Next
        uses: actions/checkout@v4
        with:
          repository: hiddify/hiddify-next
          ref: ${{ inputs.hiddify_next_ref }}
          submodules: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download custom .aar
        uses: actions/download-artifact@v4
        with:
          name: hiddify-core-bale-aar
          path: android/app/libs/

      - name: Verify .aar
        run: |
          ls -la android/app/libs/
          echo "Custom Bale-enabled core downloaded"

      - name: Flutter setup
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs || true

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --target=lib/main.dart \
            --target-platform android-arm64

      - name: Rename APK
        run: |
          mv build/app/outputs/flutter-apk/app-debug.apk \
             build/app/outputs/flutter-apk/Hiddify-Bale-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hiddify-Bale-APK
          path: build/app/outputs/flutter-apk/Hiddify-Bale-debug.apk
